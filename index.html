<!doctype html>
<!--
  جدول الورديات
  تمت البرمجة بواسطة مصطفى غنيم
  © جميع الحقوق محفوظة
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fa8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الورديات">
<title>جدول الورديات</title>
<meta name="author" content="مصطفى غنيم">
<meta name="copyright" content="© مصطفى غنيم — جميع الحقوق محفوظة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f5fa8;--blue2:#2e75b6;--soft:#e4eef9;--bg:#eef2f7;--card:#fff;--text:#18222f;--muted:#6a7584;--line:#dfe5ec;--green:#2f9e44;--red:#e03131;--orange:#f08c00;--r:14px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 8px rgba(16,40,80,.18)}
.t-title{font-weight:800;font-size:18px}
.t-sub{font-size:12.5px;opacity:.85}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;white-space:nowrap}
.hbtn.sm{padding:4px 10px;font-size:13px}
.wrap{padding:14px 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,32,60,.06),0 0 0 1px var(--line);margin-bottom:12px;overflow:hidden}
.card.dim{opacity:.72}
.card-h{background:var(--blue2);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.card-h.is-today{background:var(--blue)}
.card-h.is-today span:first-child::after{content:' · النهارده';font-weight:600;opacity:.85;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.card>.row:first-child,.card-h+.row{border-top:0}
.row:active{background:#f5f8fc}
.r-name{font-weight:700;min-width:82px;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.chip.loc{background:var(--soft);color:var(--blue)}
.chip.att-c{background:#fff;border:1.5px solid;padding:1px 9px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ok{color:var(--green)}
.note{padding:0 14px 12px;font-size:13px;color:var(--muted)}
.att{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 12px}
.att button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-weight:700;font-size:13.5px}
.att button.on{color:#fff;border-color:transparent}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.arr{width:46px;height:46px;flex-shrink:0;border-radius:12px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--blue)}
.nav-mid{flex:1;position:relative;min-height:46px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.25;padding:4px 8px;text-align:center}
.nav-mid small{font-weight:600;color:var(--muted);font-size:11.5px}
.nav-mid input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tbtn{flex:1;min-width:90px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:10px;padding:9px 8px;font-weight:700;color:var(--blue);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{display:flex;width:100%;max-width:640px}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);font-weight:700}
.bnav button.on{color:var(--blue)}
.bnav svg{width:23px;height:23px}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,20,35,.45)}
.panel{position:absolute;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sh-h span{font-size:13.5px;color:var(--muted);font-weight:600}
.msg{color:var(--muted);margin:12px 0 0}
.lbl{display:block;font-weight:700;font-size:13px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;font-size:16px}
.inp:focus{border-color:var(--blue2)}
textarea.inp{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pick button small{font-weight:600;opacity:.75;font-size:11.5px}
.pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pick button.sw{width:36px;height:36px;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pick button.sw.on{box-shadow:0 0 0 3px var(--blue)}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700}
.check input{width:20px;height:20px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--blue);color:#fff;width:100%;font-size:15px}
.btn.sec{background:var(--soft);color:var(--blue)}
.btn.danger{background:#fde8e8;color:var(--red)}
.btns{display:flex;gap:8px;margin-top:18px}
.add{display:flex;gap:8px;margin-bottom:8px}
.add .btn{width:auto;flex-shrink:0}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 12px}
.emp-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;gap:8px}
.ord{display:flex;gap:4px}
.ord button{width:34px;height:34px;border:0;border-radius:9px;background:var(--soft);color:var(--blue);font-size:12px}
.emp-a{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.emp-a button{border:0;background:var(--soft);color:var(--blue);border-radius:9px;padding:6px 11px;font-weight:700;font-size:13px}
.emp-a button.danger{background:#fde8e8;color:var(--red)}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:var(--blue2);color:#fff;padding:8px 8px;white-space:nowrap;font-weight:700}
.tbl td{padding:9px 8px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{text-align:right}
.tbl th:first-child,.tbl td:first-child{position:sticky;right:0;background:inherit}
.tbl tr{background:#fff;cursor:pointer}
.tbl thead tr{background:var(--blue2)}
.hero{text-align:center;padding:40px 20px 16px}
.hero h1{margin:10px 0 4px;font-size:26px}
.hero p{margin:0;color:var(--muted)}
.logo{width:64px;height:64px;border-radius:18px;background:var(--blue);color:#fff;display:inline-grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.grid button{background:#fff;border:0;box-shadow:0 0 0 1px var(--line);border-radius:14px;padding:18px 8px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grid button:active{background:var(--soft)}
.grid button.taken{opacity:.45}
.grid button.taken small{font-size:11.5px;color:var(--muted);font-weight:600}
.foot{text-align:center;padding:18px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:600;font-size:13.5px}
.login{padding:16px}
.pw-box{position:relative}
.pw-box button{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:6px}
.err{color:var(--red);font-weight:700;min-height:24px;margin-top:8px;font-size:14px}
.hc{background:linear-gradient(135deg,#1f5fa8,#2e75b6);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(31,95,168,.25)}
.hc-l{font-size:13px;opacity:.85;font-weight:700}
.hc-big{font-size:26px;font-weight:800;line-height:1.3;margin:2px 0 8px}
.hc-line{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:600;margin-top:4px}
.hc-line span:first-child{opacity:.75;min-width:52px;font-size:13px}
.hc .chip.att-c{background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#dde5ef;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:800;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drow{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start}
.card>.drow:first-child{border-top:0}
.drow.is-today{background:#f3f8fe;box-shadow:inset -4px 0 0 var(--blue)}
.d-date{min-width:64px;display:flex;flex-direction:column;line-height:1.3}
.d-date small{color:var(--muted);font-weight:600}
.d-body{flex:1;display:flex;flex-direction:column;gap:3px}
.note-i{color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px}
.banner{background:#fff4e0;color:#8a5300;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.net{background:var(--red);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:5px}
.pbar{background:#fff4e0;color:#8a5300;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-weight:700;font-size:13.5px;gap:8px}
.pbar button{border:0;background:#8a5300;color:#fff;border-radius:8px;padding:5px 12px;font-weight:700}
.set-body{padding:12px 14px}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#18222f;color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bell{position:relative}
.badge{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;font-weight:800;line-height:1}
.bnav button{position:relative}
.bnav .badge{top:3px;left:calc(50% - 22px)}
.install{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:10px 12px;margin:0 0 12px}
.install .ic{width:40px;height:40px;border-radius:11px;flex-shrink:0;background:var(--blue) url(icon-192.png) center/cover}
.install div{flex:1;line-height:1.35}
.install b{display:block;font-size:14px}
.install small{color:var(--muted);font-size:12px}
.install .go{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;white-space:nowrap}
.install .x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
.newmsg{display:block;width:100%;text-align:right;border:0;background:#fff4e0;color:#5c3a00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;box-shadow:0 0 0 1px #f3d9a8}
.newmsg span{display:block;font-weight:600;font-size:13.5px;color:#7a5410;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{padding:12px 14px;border-top:1px solid var(--line)}
.mc:first-child{border-top:0}
.mc.new{background:#f3f8fe;box-shadow:inset -4px 0 0 var(--blue)}
.mc-t{white-space:pre-wrap;word-break:break-word}
.mc-d{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.phs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phs button{border:1px dashed var(--blue2);background:var(--soft);color:var(--blue);border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px}
.preview{background:#f6f8fb;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:inset 0 0 0 1px var(--line)}
.preview small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-bottom:2px}
.btn.wa{background:#1fa855;color:#fff}
a.btn{display:block;text-align:center;text-decoration:none}
.wa-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wa-row div{flex:1}
.wa-row a{border-radius:10px;padding:8px 14px;width:auto;font-size:14px}
.tpl-del{border:0;background:none;color:var(--red);font-weight:800;padding:0 4px}
.steps{margin:10px 0 0;padding-inline-start:22px;line-height:1.9}
.steps b{color:var(--blue)}
.credit{text-align:center;color:var(--muted);font-size:12px;padding:14px 16px 4px;line-height:1.7}
.credit b{color:var(--blue)}
.snd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f6f8fb;border-radius:12px;padding:8px 12px;margin-top:12px;font-weight:700;font-size:14px}
.snd button{border:0;border-radius:9px;padding:6px 12px;font-weight:800;font-size:13px}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px}
.lock-card{background:#fff;border-radius:20px;box-shadow:0 0 0 1px #f3c9c9,0 10px 30px rgba(160,30,30,.12);overflow:hidden;text-align:center}
.lock-top{background:linear-gradient(135deg,#c92a2a,#e03131);color:#fff;padding:26px 18px 20px}
.lock-ic{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-grid;place-items:center;margin-bottom:8px}
.lock-top h1{margin:0;font-size:22px}
.lock-top p{margin:4px 0 0;opacity:.9;font-size:14px}
.lock-body{padding:18px 18px 20px}
.lock-body p{margin:0 0 16px;font-size:15.5px;line-height:1.8}
.lock-phone{font-size:24px;font-weight:800;color:var(--blue);letter-spacing:1px;margin:0 0 14px;direction:ltr}
.lock-body .btns{margin-top:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch b{display:block}
.tgl{width:54px;height:30px;border-radius:999px;border:0;background:#cfd6df;position:relative;flex-shrink:0;transition:.2s}
.tgl::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tgl.on{background:var(--red)}
.tgl.on::after{right:27px}
.lockbar{background:#c92a2a;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 12px}
.punch{margin-top:14px;width:100%;border:0;border-radius:14px;background:#fff;color:var(--blue);font-weight:800;font-size:18px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.punch svg{width:28px;height:28px}
.punch.out{color:#c92a2a}
.punch.off{background:rgba(255,255,255,.14);color:#fff;font-size:14.5px;font-weight:700;box-shadow:none;padding:11px;text-align:center}
.punch-info{margin-top:12px;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.bigopt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:#fff;border:0;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(16,32,60,.06);padding:16px;margin-bottom:12px}
.bigopt:active{background:var(--soft)}
.bo-ic{width:58px;height:58px;border-radius:16px;background:var(--soft);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.bo-ic svg{width:34px;height:34px}
.bigopt b{display:block;font-size:17px}
.bigopt small{display:block;color:var(--muted);font-size:13px;font-weight:600;line-height:1.5}
.logo svg{width:34px;height:34px}
.cam{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:16px auto 10px;border-radius:50%;overflow:hidden;background:#111}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 5px rgba(255,255,255,.35);transition:.2s}
.cam.ok .cam-ring{box-shadow:inset 0 0 0 7px var(--green)}
.cam.bad .cam-ring{box-shadow:inset 0 0 0 7px var(--red)}
#cam-msg{text-align:center;font-weight:800;font-size:17px;min-height:30px}
.cam-prog{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 30px 0}
.cam-prog span{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.st-box{text-align:center;padding:14px 6px 4px}
.st-box>b{display:block;font-size:20px;margin-top:10px}
.st-box p{color:var(--muted);margin:8px 0 0;line-height:1.8}
.st-ic{width:70px;height:70px;border-radius:50%;display:inline-grid;place-items:center;font-size:34px;font-weight:800}
.st-ic.ok{background:#e3f6e8;color:var(--green)}
.st-ic.bad{background:#fde8e8;color:var(--red)}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--blue);margin:6px auto 0;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pl{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 14px 10px;font-size:13px;color:var(--text)}
.pl span{display:inline-flex;align-items:center;gap:4px}
.pl svg{width:15px;height:15px;color:var(--blue)}
.pl small{color:var(--muted)}
.pl-bad{color:var(--red);font-weight:700}
.tgl.on.ok{background:var(--green)}
.loading{display:grid;place-items:center;min-height:70vh;color:var(--muted);font-weight:700}
#print{display:none}
@media print{
  #app,#sheet,#toast{display:none!important}
  #print{display:block;font-family:'Cairo',sans-serif}
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  #print h2{margin:0 0 8px;font-size:16px}
  #print table{width:100%;border-collapse:collapse;font-size:11px}
  #print th,#print td{border:1px solid #888;padding:4px;text-align:center;vertical-align:middle}
  #print th{background:#2e75b6;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print td.n{font-weight:700;background:#eef3f9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function seedData(){
  const names=['عماد','ابراهيم','عبد العزيز','محمود','طارق','عبد الله','طه','محمد'], e={};
  names.forEach((n,i)=>e['e'+(i+1)]={name:n,order:i});

    meta:{created:Date.now(),v:1}, employees:e,
    shifts:{s1:{name:'صباحي',color:'#cfe2f3',order:0},s2:{name:'مسائي',color:'#f8cbad',order:1}},
    locations:{l1:{name:'ملاعب',order:0},l2:{name:'بوابة رقم 1',order:1},l3:{name:'بوابة رقم 3',order:2},l4:{name:'جراج',order:3}},

function setPath(path,val){const ks=path.split('/').filter(Boolean);if(!ks.length){state=val||{};return;}let o=state;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}const k=ks[ks.length-1];if(val===null||val===undefined)delete o[k];else o[k]=val;}

function clean(v){return v===undefined?null:JSON.parse(JSON.stringify(v));}
function saveMany(upd){
  const u={};Object.entries(upd).forEach(([p,v])=>{u[p]=clean(v);setPath(p,u[p]);});

/* ---------- مزامنة مع Google Sheets ---------- */
async function api(body){
  const r=body?await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
              :await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now());
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(j&&j.error) throw new Error(j.error); return j;
}
function setOnline(v){if(online!==v){online=v;render();}}
async function flush(){
  if(inflight||!queue.length) return;
  const batch=queue.slice(),upd=Object.assign({},...batch);
  inflight++;writeSeq++;
  try{
    const res=await api({upd});
    queue=queue.slice(batch.length);ls.set('sr_queue',JSON.stringify(queue));
    inflight--;setOnline(true);
    if(!queue.length){state=res||{};queue.forEach(q=>Object.entries(q).forEach(([p,v])=>setPath(p,v)));ls.set('sr_cache',JSON.stringify(state));render();}
    else flush();
  }catch(e){inflight--;setOnline(false);toast('التعديل ماوصلش للشيت، هيتبعت تاني لما النت يرجع');}
}
async function pull(){
  if(pulling||inflight) return;
  if(queue.length) return flush();
  pulling=true;const seq=writeSeq;
  try{
    const res=await api();
    pulling=false;setOnline(true);
    if(seq!==writeSeq||inflight||queue.length) return;
    state=res||{};ls.set('sr_cache',JSON.stringify(state));
    if(!state.meta){saveMany(seedData());}
    ready=true;render();pingSeen();checkNotify();
  }catch(e){pulling=false;setOnline(false);if(!ready)fatal('مش قادر أوصل للداتا. اتأكد من النت ومن لينك API_URL.');}
}

const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const FACE_MATCH = 0.5;      // أقل من كده = نفس الشخص
const EARLY_MIN = 60;        // البصمة بتفتح قبل الوردية بساعة
const pset = () => state.settings || {};

const liveOn = () => !pset().liveOff;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtClock = t => {const d=new Date(t),h=d.getHours();return `${h%12||12}:${pad(d.getMinutes())}${h<12?'ص':'م'}`;};
const pTime = (p,k) => typeof p?.[k+'S']==='number' ? p[k+'S'] : (typeof p?.[k]==='number' ? p[k] : null);
const punchOf = (d,id) => state.punches?.[d]?.[id] || null;

function shiftWin(d,id){
  const en=ent(d,id),s=en?.shift&&state.shifts?.[en.shift];if(!s)return null;
  const st=en.status&&state.statuses?.[en.status];
  if(!s.start||!s.end)return {d,s,st,open:true};
  const[h1,m1]=s.start.split(':').map(Number),[h2,m2]=s.end.split(':').map(Number);
  const a=toDate(d);a.setHours(h1,m1,0,0);const b=toDate(d);b.setHours(h2,m2,0,0);if(b<=a)b.setDate(b.getDate()+1);
  return {d,s,st,start:a.getTime(),end:b.getTime()};
}
function punchAtt(d,id){
  const t=pTime(punchOf(d,id),'in');if(t==null)return null;
  const w=shiftWin(d,id);if(!w||w.open)return 'present';
  return t>w.start+graceMin()*60000?'late':'present';
}
function findOpen(id){
  for(const d of [today(),addDays(today(),-1)]){const p=punchOf(d,id),ti=pTime(p,'in');
    if(ti!=null&&pTime(p,'out')==null&&Date.now()-ti<20*3600e3)return d;}
  return null;
}
function punchTarget(id){
  const open=findOpen(id);if(open)return {ok:true,kind:'out',d:open};
  const now=Date.now(),early=EARLY_MIN*60000;let noTimes=null,rest=null,next=null;
  for(const d of [today(),addDays(today(),-1)]){
    const w=shiftWin(d,id);if(!w)continue;
    if(w.st&&!w.st.work){if(d===today())rest=`النهارده ${w.st.name} ليك`;continue;}
    if(pTime(punchOf(d,id),'in')!=null)continue;
    if(w.open){if(d===today())noTimes=d;continue;}
    if(now>=w.start-early&&now<=w.end)return {ok:true,kind:'in',d,w};
    if(now<w.start-early&&d===today())next=w;
  }
  if(noTimes)return {ok:true,kind:'in',d:noTimes};
  if(pTime(punchOf(today(),id),'out')!=null)return {ok:false,msg:'سجّلت حضورك وانصرافك النهارده ✓'};
  if(rest)return {ok:false,msg:rest};
  if(next)return {ok:false,msg:`البصمة بتفتح الساعة ${fmtClock(next.start-early)}`};
  return {ok:false,msg:'مفيش وردية ليك دلوقتي'};
}

/* الموقع */
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:9});navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0});});}
function geoCheck(c){
  const gs=list('geos');if(!gs.length)return {ok:true,none:true};let best=null;
  gs.forEach(g=>{const dist=distM(c.latitude,c.longitude,+g.lat,+g.lng),over=dist-(+g.r||100);if(!best||over<best.over)best={g,dist,over};});
  return {ok:best.over<=0,...best};
}
function parseCoords(s){const m=String(s).match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?{lat:+m[1],lng:+m[2]}:null;}

/* بصمة الصباع (بصمة الموبايل نفسه) */
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function fingerOK(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function fingerCreate(id){
  const e=state.employees[id];
  const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'جدول الورديات'},
    user:{id:new TextEncoder().encode((id+'.'+deviceId).slice(0,60)),name:e.name,displayName:e.name},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  return b64u(c.rawId);
}
async function fingerVerify(cred){
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:ub64(cred),transports:['internal']}],userVerification:'required',timeout:60000}});
  return !!(new Uint8Array(a.response.authenticatorData)[32]&4);
}

/* بصمة الوش (الكاميرا الأمامية) */
let faceP=null,cam=null,camAbort=false;
function loadFace(){
  if(!faceP)faceP=(async()=>{
    if(!window.faceapi)await loadScript(FACE_LIB);
    await faceapi.tf?.ready?.();
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)]);
  })().catch(e=>{faceP=null;throw Object.assign(new Error('models'),{name:'ModelError'});});
  return faceP;
}
const fOpts=()=>new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});
const ear=p=>{const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return (d(p[1],p[5])+d(p[2],p[4]))/(2*d(p[0],p[3]));};
const eyes=lm=>(ear(lm.getLeftEye())+ear(lm.getRightEye()))/2;
function stopCam(){try{cam&&cam.getTracks().forEach(t=>t.stop());}catch(e){}cam=null;}

  openSheet(`<div class="sh-h"><b>${title}</b></div><div class="cam" id="cam"><video id="cam-v" playsinline muted autoplay></video><div class="cam-ring"></div></div>
  <div id="cam-msg">بيجهّز الكاميرا…</div><div class="cam-prog"><span id="cam-prog"></span></div>
  <div class="btns"><button class="btn sec" data-act="closeSheet">إلغاء</button></div>`);
  window.__onClose=()=>{camAbort=true;stopCam();};
}
function camMsg(t,cls){const m=document.getElementById('cam-msg');if(m)m.textContent=t;const c=document.getElementById('cam');if(c){c.classList.remove('ok','bad');if(cls)c.classList.add(cls);}}
function camProg(f){const p=document.getElementById('cam-prog');if(p)p.style.width=Math.round(Math.max(0,Math.min(1,f))*100)+'%';}
async function startCam(){
  if(!navigator.mediaDevices?.getUserMedia)throw Object.assign(new Error(''),{name:'NoCamera'});
  camMsg('بيحمّل التعرف على الوش… أول مرة بس بتاخد شوية');
  const [,stream]=await Promise.all([loadFace(),navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false})]);
  cam=stream;if(camAbort){stopCam();return null;}
  const v=document.getElementById('cam-v');if(!v){stopCam();return null;}
  v.srcObject=stream;await v.play().catch(()=>{});
  if(v.readyState<2)await new Promise(r=>v.addEventListener('loadeddata',r,{once:true}));
  return v;
}
function camErr(e){
  stopCam();window.__onClose=null;
  const n=e?.name;
  if(n==='NotAllowedError'||n==='SecurityError')failSheet('الكاميرا مقفولة','لازم تسمح للتطبيق يستخدم الكاميرا. افتح إعدادات المتصفح ← الموقع ← الكاميرا ← سماح، وجرّب تاني.');
  else if(n==='ModelError')failSheet('مش قادر أحمّل التعرف على الوش','اتأكد إن النت شغال وجرّب تاني.');
  else failSheet('الكاميرا مش شغالة','اتأكد إن مفيش تطبيق تاني فاتح الكاميرا وجرّب تاني.');
  return 'err';
}
function faceSize(det,v){return det.detection.box.width>=v.videoWidth*0.2;}

async function faceVerify(id){
  const saved=bioOf(id).face;
  camSheet('بصمة الوش');
  let v;try{v=await startCam();}catch(e){return camErr(e);}
  if(!v)return null;
  const t0=Date.now();let match=0,miss=0,maxE=0,closed=false,blink=!liveOn();
  camMsg('بص للكاميرا');
  while(!camAbort&&Date.now()-t0<25000){
    if(match<3||blink){
      const det=await faceapi.detectSingleFace(v,fOpts()).withFaceLandmarks().withFaceDescriptor();
      if(camAbort)break;
      if(!det){camMsg('مش شايف وشك، بص للكاميرا');await sleep(60);continue;}
      if(!faceSize(det,v)){camMsg('قرّب الموبايل من وشك');continue;}
      const dist=faceapi.euclideanDistance(det.descriptor,saved);
      if(dist<FACE_MATCH){match++;camMsg(blink?'تمام…':'خليك باصص…','ok');}
      else if(dist>0.58&&det.detection.score>0.7){miss++;camMsg('ده مش الوش المتسجل','bad');}
      if(miss>=4&&match===0){stopCam();return false;}
      if(blink&&match>=4){camProg(1);camMsg('تمام ✓','ok');stopCam();await sleep(300);return true;}
      if(match>=3&&!blink)camMsg('غمّض عينك ثانية وافتحها','ok');
      camProg(match/(liveOn()?6:4));
    } else {
      // التأكد إنه وش حقيقي مش صورة: لازم يرمش
      const det=await faceapi.detectSingleFace(v,fOpts()).withFaceLandmarks();
      if(camAbort)break;
      if(!det){camMsg('خليك باصص للكاميرا');continue;}
      const e=eyes(det.landmarks);if(e>maxE)maxE=e;
      if(e<maxE*0.72)closed=true;
      else if(closed&&e>maxE*0.85){blink=true;camMsg('تمام، لحظة…','ok');camProg(0.8);}
      if(!blink)camMsg(closed?'افتح عينك':'غمّض عينك ثانية وافتحها','ok');
    }
  }
  stopCam();if(camAbort)return null;
  return match>=3&&!blink?'noblink':'timeout';
}

async function enrollFace(id){
  camSheet('تسجيل بصمة الوش');
  let v;try{v=await startCam();}catch(e){camErr(e);return;}
  if(!v)return;
  const N=5,samples=[],t0=Date.now();camMsg('بص للكاميرا ومتتحركش');
  while(!camAbort&&Date.now()-t0<30000&&samples.length<N){
    const det=await faceapi.detectSingleFace(v,fOpts()).withFaceLandmarks().withFaceDescriptor();
    if(camAbort)break;
    if(!det){camMsg('مش شايف وشك، بص للكاميرا');await sleep(60);continue;}
    if(!faceSize(det,v)){camMsg('قرّب الموبايل من وشك');continue;}
    if(det.detection.score<0.7){camMsg('خلّي النور قدام وشك');continue;}
    if(samples.length&&faceapi.euclideanDistance(det.descriptor,samples[0])>0.45){samples.length=0;camProg(0);camMsg('متتحركش، بص للكاميرا على طول');continue;}
    samples.push(Array.from(det.descriptor));camProg(samples.length/N);camMsg('تمام، خليك ثابت…','ok');
    await sleep(250);
  }
  stopCam();window.__onClose=null;
  if(camAbort)return;
  if(samples.length<N)return failSheet('ماعرفتش أسجّل وشك','جرّب في مكان منور، وخلّي وشك كله جوه الدايرة.');
  const avg=new Array(128).fill(0);samples.forEach(s=>s.forEach((x,i)=>avg[i]+=x/N));
  for(const e of list('employees')){
    if(e.id===id||e.bio?.type!=='face'||!Array.isArray(e.bio.face))continue;
    if(faceapi.euclideanDistance(avg,e.bio.face)<0.45){logFail(id,'dup');return failSheet('الوش ده متسجل لموظف تاني','كل موظف لازم يسجّل بوشه هو. لو في غلط كلم الأدمن.');}
  }
  save(`employees/${id}/bio`,{type:'face',face:avg.map(x=>Math.round(x*1e4)/1e4),dev:deviceId,at:Date.now()});
  okSheet('اتسجلت بصمة وشك','من دلوقتي هتبص للكاميرا كل ما تسجّل حضور أو انصراف.');
}

let punching=false;
async function doPunch(){
  const me=state.devices?.[deviceId];if(!me||punching)return;
  const b=bioOf(me);if(!b)return render();
  const tg=punchTarget(me);if(!tg.ok)return toast(tg.msg);
  if(b.type==='finger'&&b.dev!==deviceId)return failSheet('البصمة متسجلة على موبايل تاني','كلم الأدمن يمسح بصمتك عشان تسجّلها تاني على الموبايل ده.');
  punching=true;
  try{
    let dist=null;
    if(list('geos').length){
      stepSheet('بيحدد موقعك…');
      let c;try{c=await getPos();}catch(e){return failSheet('ماقدرتش أعرف موقعك',e?.code===1?'لازم تسمح للتطبيق يعرف موقعك: إعدادات المتصفح ← الموقع ← سماح.':'شغّل الـ GPS (الموقع) من الموبايل وجرّب تاني.');}
      const gc=geoCheck(c);
      if(!gc.ok){logFail(me,'geo',gc.dist);return failSheet('انت بعيد عن مكان الشغل',`انت على بعد <b>${gc.dist} متر</b> من "${esc(gc.g.name)}"، والمسموح ${+gc.g.r||100} متر بس.${c.accuracy>100?'<br>الموقع مش دقيق دلوقتي، شغّل الـ GPS واقف في مكان مفتوح.':''}`);}
      dist=gc.dist;
    }
    let ok;
    if(b.type==='face'){ok=await faceVerify(me);}
    else{stepSheet('حط صباعك على حساس البصمة…');try{ok=await fingerVerify(b.cred);}catch(e){ok=e?.name==='NotAllowedError'?'cancel':false;}}
    if(ok===null||ok==='err')return;
    if(ok==='cancel'){closeSheet();return toast('البصمة اتلغت أو ماتعرفتش، جرّب تاني');}
    if(ok==='timeout')return failSheet('ماقدرتش أتأكد من وشك','جرّب في مكان منور وبص للكاميرا على طول.');
    if(ok==='noblink')return failSheet('لازم ترمش بعينك','عشان نتأكد إن ده وشك انت مش صورة: غمّض عينك ثانية وافتحها وانت باصص للكاميرا.');
    if(!ok){logFail(me,b.type);return failSheet(b.type==='face'?'الوش ده مش متسجل على الحساب ده':'البصمة مش مطابقة',b.type==='face'?'كل موظف بيبصم بوشه هو بس. المحاولة دي اتسجلت عند الأدمن.':'جرّب تاني بنفس الصباع اللي سجّلت بيه.');}
    const now=Date.now(),k=tg.kind,base=`punches/${tg.d}/${me}/`;
    const u={[base+k]:now,[base+k+'S']:'__NOW__',[base+k+'M']:b.type};if(dist!=null)u[base+k+'D']=dist;
    saveMany(u);
    let st='';
    if(k==='in'){const w=shiftWin(tg.d,me);if(w&&!w.open&&now>w.start+graceMin()*60000)st=`اتسجلت <b style="color:var(--orange)">متأخر ${Math.round((now-w.start)/60000)} دقيقة</b>`;else st='اتسجلت <b style="color:var(--green)">حاضر</b>';}
    okSheet(k==='in'?'اتسجل حضورك':'اتسجل انصرافك',`الساعة ${fmtClock(now)}${st?'<br>'+st:''}`);
  }finally{punching=false;}
}

/* ---------- صوت الرسايل ---------- */
let actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
const soundOn=()=>ls.get('sr_sound')!=='0';
function chime(force){
  if(!force&&!soundOn())return;
  try{unlockAudio();if(actx){const t=actx.currentTime+0.02;
    [[784,0],[1047,0.16],[1319,0.32]].forEach(([f,dt])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+dt);g.gain.exponentialRampToValueAtTime(0.4,t+dt+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.6);
      o.connect(g);g.connect(actx.destination);o.start(t+dt);o.stop(t+dt+0.65);});}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([180,90,180]);}catch(e){}
}

/* ---------- messages ---------- */
const PH=['{الاسم}','{الوردية}','{المكان}','{الحالة}','{اليوم}','{التاريخ}'];
const draft={to:'all',text:'',day:'today'};
const draftDate=()=>draft.day==='today'?today():draft.day==='tomorrow'?addDays(today(),1):draft.day;
function resolveText(t,empId,d){
  const e=state.employees?.[empId]||{},en=ent(d,empId)||{},s=state.shifts?.[en.shift],l=state.locations?.[en.loc],st=state.statuses?.[en.status];
  return String(t).split('{الاسم}').join(e.name||'').split('{الوردية}').join(s?s.name+(s.start&&s.end?` (${fmtTime(s.start)} – ${fmtTime(s.end)})`:''):'مش متحدد')
   .split('{المكان}').join(l?.name||'مش متحدد').split('{الحالة}').join(st?.name||'مش متحدد').split('{التاريخ}').join(fullD(d)).split('{اليوم}').join(dayName(d));
}
const draftTo=()=>draft.to==='all'?list('employees').map(e=>e.id):list('employees').map(e=>e.id).filter(id=>draft.to[id]);
const msgsFor=id=>list('messages').filter(m=>m.to&&m.to[id]).sort((a,b)=>(b.at||0)-(a.at||0));
const msgText=(m,id)=>m.texts?.[id]??m.text??'';
const unreadFor=id=>msgsFor(id).filter(m=>!state.reads?.[id]?.[m.id]);
function fmtAt(t){const d=new Date(t);const h=d.getHours(),mi=d.getMinutes();return `${dayName(toStr(d))} ${shortD(toStr(d))} · ${h%12||12}:${pad(mi)}${h<12?'ص':'م'}`;}
const waNum=p=>{let n=String(p||'').replace(/\D/g,'');if(!n)return '';if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='20'+n.slice(1);return n;};
const waLink=(p,t)=>`https://wa.me/${waNum(p)}?text=${encodeURIComponent(t)}`;
function openMsgs(id,own){
  const ms=msgsFor(id),rd=state.reads?.[id]||{};
  const notif=own&&'Notification' in window&&Notification.permission==='default'?`<div class="btns" style="margin-top:12px"><button class="btn sec" data-act="enableNotif">فعّل الإشعارات عشان توصلك الرسايل</button></div>`:'';
  const snd=own?`<div class="snd"><span>🔔 صوت الرسايل: ${soundOn()?'شغال':'مقفول'}</span><span style="display:flex;gap:6px"><button style="background:var(--soft);color:var(--blue)" data-act="testSound">جرّب</button><button style="background:${soundOn()?'#fde8e8':'var(--blue)'};color:${soundOn()?'var(--red)':'#fff'}" data-act="toggleSound">${soundOn()?'اقفله':'شغّله'}</button></span></div>`:'';
  openSheet(`<div class="sh-h"><b>الرسايل</b><span>${ms.length} رسالة</span></div>${snd}${notif}
  ${ms.length?`<div style="margin:10px -16px 0">${ms.map(m=>`<div class="mc ${rd[m.id]?'':'new'}"><div class="mc-t">${esc(msgText(m,id))}</div><div class="mc-d"><span>${fmtAt(m.at)}</span>${rd[m.id]?'':'<b style="color:var(--blue)">جديدة</b>'}</div></div>`).join('')}</div>`:empty('مفيش رسايل لسه')}
  <div class="btns"><button class="btn sec" data-act="closeSheet">قفل</button></div>`);
  if(own){const un=ms.filter(m=>!rd[m.id]);if(un.length){const u={};un.forEach(m=>u[`reads/${id}/${m.id}`]=Date.now());saveMany(u);}}
}
let notifyReady=false;
function checkNotify(){
  if(isAdmin())return;const me=state.devices?.[deviceId];if(!me||!state.employees?.[me])return;
  let seen;try{seen=JSON.parse(ls.get('sr_notified')||'{}')||{};}catch(e){seen={};}
  const un=unreadFor(me).filter(m=>!seen[m.id]);
  if(un.length){un.forEach(m=>seen[m.id]=1);ls.set('sr_notified',JSON.stringify(seen));
    if(notifyReady){toast('وصلتك رسالة جديدة');chime();
      if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('رسالة جديدة',{body:msgText(un[0],me).slice(0,160),icon:'icon-192.png',badge:'icon-192.png',tag:'msg-'+un[0].id,renotify:true,silent:false,vibrate:[200,100,200],lang:'ar',dir:'rtl'})).catch(()=>{});}}
  notifyReady=true;
}

/* ---------- UI pieces ---------- */
const chip = (t,c) => `<span class="chip" style="background:${safeColor(c)};color:${textOn(c)}">${esc(t)}</span>`;
function chipsFor(e,a){
  let h='';
  const s=e?.shift&&state.shifts?.[e.shift]; if(s) h+=chip(s.name,s.color||'#cfe2f3');
  const l=e?.loc&&state.locations?.[e.loc]; if(l) h+=`<span class="chip loc">${esc(l.name)}</span>`;
  const st=e?.status&&state.statuses?.[e.status]; if(st) h+=chip(st.name,st.color);
  if(a&&ATT[a]) h+=`<span class="chip att-c" style="border-color:${ATT[a].c};color:${ATT[a].c}">${ATT[a].t}</span>`;
  return h;
}
const nav = (label,sub,act,input='') => `<div class="nav"><button class="arr" data-act="${act}" data-n="-1" aria-label="السابق">${I.prev}</button><div class="nav-mid">${label}${sub?`<small>${sub}</small>`:''}${input}</div><button class="arr" data-act="${act}" data-n="1" aria-label="التالي">${I.next}</button></div>`;
const empty = (t,s='') => `<div class="empty"><b>${t}</b>${s?`<p>${s}</p>`:''}</div>`;
const localWarn = () => mode==='local' ? '<div class="net">الصفحة مش متوصلة بـ Google Sheets — الداتا هنا على الموبايل ده بس ومش بتتشارك</div>' : '';
const netBar = () => mode==='gas'&&!online ? '<div class="net">مفيش اتصال بالنت — التعديلات هتتبعت أول ما يرجع</div>' : '';

function openSheet(html){$sheet.innerHTML=`<div class="backdrop" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true">${html}</div>`;$sheet.classList.add('open');document.body.style.overflow='hidden';}
function closeSheet(){if(window.__onClose){const f=window.__onClose;window.__onClose=null;f();}$sheet.classList.remove('open');$sheet.innerHTML='';document.body.style.overflow='';editCtx=null;if(pendingRender)render();}
function confirmSheet(title,msg,ok,fn,danger){confirmFn=fn;openSheet(`<div class="sh-h"><b>${title}</b></div><p class="msg">${msg}</p><div class="btns"><button class="btn ${danger?'danger':''}" data-act="confirmOk">${ok}</button><button class="btn sec" data-act="closeSheet">إلغاء</button></div>`);}
const selVal = g => $sheet.querySelector(`[data-group="${g}"] .on`)?.dataset.v || '';

/* ---------- render ---------- */
function render(){
  if(!ready) return;
  const a=document.activeElement;
  if(a&&$app.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&['text','password','search'].includes(a.type)))){pendingRender=true;return;}
  pendingRender=false;
  const y=window.scrollY;
  $app.innerHTML=route();
  window.scrollTo(0,y);
}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(render,0);});
const top0 = () => window.scrollTo(0,0);

function route(){
  if(isAdmin()){
    if(view.preview&&state.employees?.[view.preview]) return userView(view.preview,false);
    return adminView();
  }
  if(view.screen==='login') return loginView();
  if(state.settings?.payLock) return lockView();
  const me=state.devices?.[deviceId];
  if(me&&state.employees?.[me]) return (punchOn()&&!bioOf(me))?enrollView(me):userView(me,true);
  return pickView();
}

  ${emps.length?`<div class="grid">${emps.map(e=>{const tk=isTaken(e.id);return `<button data-act="pick" data-id="${e.id}" class="${tk?'taken':''}">${esc(e.name)}${tk?'<small>متسجل</small>':''}</button>`;}).join('')}</div>`:empty('لسه مفيش موظفين','الأدمن لازم يضيف الأسامي الأول')}
  <div class="foot"><button class="link" data-act="toLogin">دخول الأدمن</button></div>${credit()}`;

/* ---------- employee view ---------- */
function dayRow(d,id){
  const en=ent(d,id),a=attOf(d,id),s=en?.shift&&state.shifts?.[en.shift];
  return `<div class="drow ${d===today()?'is-today':''}"><div class="d-date"><b>${dayName(d)}</b><small>${shortD(d)}</small></div><div class="d-body"><div class="chips">${chipsFor(en,a)||'<span class="muted">مش متحدد</span>'}</div>${s&&s.start&&s.end?`<div class="small muted">${fmtTime(s.start)} – ${fmtTime(s.end)}</div>`:''}${punchMini(d,id)}${en?.note?`<div class="small note-i">${esc(en.note)}</div>`:''}</div></div>`;
}
function userView(id,own){
  const e=state.employees[id],T=today(),en=ent(T,id),a=attOf(T,id);
  const s=en?.shift&&state.shifts?.[en.shift],l=en?.loc&&state.locations?.[en.loc],st=en?.status&&state.statuses?.[en.status];
  let h=own?'':`<div class="pbar"><span>بتشوف صفحة ${esc(e.name)} زي ما هو شايفها</span><button data-act="endPreview">رجوع</button></div>`;
  const un=unreadFor(id);
  h+=`<header class="top"><div><div class="t-title">أهلاً يا ${esc(e.name)}</div><div class="t-sub">${dayName(T)} ${fullD(T)}</div></div><button class="hbtn bell" data-act="openMsgs" data-id="${id}" data-own="${own?1:''}">الرسايل${un.length?`<span class="badge">${un.length}</span>`:''}</button></header>${netBar()}${localWarn()}<div class="wrap">`;
  if(own) h+=installBanner();
  if(un.length) h+=`<button class="newmsg" data-act="openMsgs" data-id="${id}" data-own="${own?1:''}">عندك ${un.length===1?'رسالة جديدة':un.length+' رسايل جديدة'} ←<span>${esc(msgText(un[0],id))}</span></button>`;
  h+=`<div class="hc"><div class="hc-l">النهارده</div>`;
  if(en){
    h+=`<div class="hc-big">${st?esc(st.name):(s?esc(s.name):'—')}</div>`;
    if(s) h+=`<div class="hc-line"><span>الوردية</span><b>${esc(s.name)}${s.start&&s.end?` · ${fmtTime(s.start)} – ${fmtTime(s.end)}`:''}</b></div>`;
    if(l) h+=`<div class="hc-line"><span>المكان</span><b>${esc(l.name)}</b></div>`;
    if(en.note) h+=`<div class="hc-line"><span>ملاحظة</span><b>${esc(en.note)}</b></div>`;
  } else h+=`<div class="hc-big" style="font-size:19px">لسه مفيش جدول للنهارده</div>`;
  if(a&&ATT[a]) h+=`<div class="hc-line"><span>الحضور</span><span class="chip att-c" style="border-color:${ATT[a].c};color:${ATT[a].c}">${ATT[a].t}</span></div>`;
  if(own) h+=punchBox(id);
  h+=`</div><div class="seg"><button data-act="uTab" data-v="week" class="${view.uTab==='week'?'on':''}">الأسبوع</button><button data-act="uTab" data-v="month" class="${view.uTab==='month'?'on':''}">الشهر</button></div>`;
  if(view.uTab==='week'){
    const ds=weekDates(view.uWeek);
    h+=nav(`${shortD(ds[0])} – ${fullD(ds[6])}`,ds.includes(T)?'الأسبوع ده':'','uWeekStep',`<input type="date" value="${view.uWeek}" data-change="setUWeek" aria-label="اختار أسبوع">`);
    h+=`<div class="card">${ds.map(d=>dayRow(d,id)).join('')}</div>`;
  } else {
    const ds=monthDates(view.uMonth),c=countFor(id,ds),sts=list('statuses');
    h+=nav(monthLabel(view.uMonth),'','uMonthStep',`<input type="month" value="${view.uMonth}" data-change="setUMonth" aria-label="اختار شهر">`);
    const boxes=[...sts.map(s=>[s.name,c.st[s.id]||0,safeColor(s.color)]),...Object.entries(ATT).map(([k,v])=>[v.t,c.att[k]||0,v.c])];
    h+=`<div class="stats">${boxes.map(([t,n,col])=>`<div class="stat"><b style="color:${col}">${n}</b><span>${esc(t)}</span></div>`).join('')}</div>`;
    const rows=ds.filter(d=>ent(d,id)||attOf(d,id));
    h+=rows.length?`<div class="card">${rows.map(d=>dayRow(d,id)).join('')}</div>`:empty('مفيش حاجة متسجلة الشهر ده');
  }
  h+=`</div>`;
  if(own) h+=`<div class="foot"><button class="link" data-act="toLogin">دخول الأدمن</button></div>`;
  h+=credit();
  return h;
}

/* ---------- admin ---------- */
function adminView(){
  const tabs=[['today','اليوم',I.today],['week','الجدول',I.week],['emps','الموظفين',I.users],['reports','التقارير',I.chart],['msgs','الرسايل',I.msg],['settings','الإعدادات',I.gear]];
  const titles={today:'حضور اليوم',week:'جدول الأسبوع',emps:'الموظفين',reports:'تقارير الشهر',msgs:'الرسايل',settings:'الإعدادات'};
  const body={today:tabToday,week:tabWeek,emps:tabEmps,reports:tabReports,msgs:tabMsgs,settings:tabSettings}[view.tab]();
  const warn=mode==='local'?`<div class="banner">وضع تجريبي: الداتا محفوظة على الجهاز ده بس. حط لينك Google Sheets في API_URL جوه الكود عشان الموظفين يشوفوا الجدول من موبايلاتهم.</div>`:'';
  return `<header class="top"><div><div class="t-title">${titles[view.tab]}</div><div class="t-sub">لوحة تحكم الأدمن</div></div><button class="hbtn" data-act="logout">خروج</button></header>${netBar()}${state.settings?.payLock?'<div class="lockbar">وضع عدم الدفع مفعّل — الموظفين شايفين رسالة التحذير بس</div>':''}
  <div class="wrap">${warn}${body}${credit()}</div>
  <nav class="bnav"><div class="bnav-in">${tabs.map(([k,t,ic])=>`<button data-act="tab" data-v="${k}" class="${view.tab===k?'on':''}">${ic}<span>${t}</span></button>`).join('')}</div></nav>`;
}

function tabToday(){
  const d=view.date,emps=list('employees');let working=0;const c={present:0,late:0,absent:0,excused:0};
  emps.forEach(e=>{const st=ent(d,e.id)?.status;if(st&&state.statuses?.[st]?.work)working++;const a=attOf(d,e.id);if(a)c[a]++;});
  let h=nav(`${dayName(d)} ${fullD(d)}`,d===today()?'النهارده':'اضغط هنا لاختيار يوم','dayStep',`<input type="date" value="${d}" data-change="setDate" aria-label="اختار يوم">`);
  h+=`<div class="stats"><div class="stat"><b>${working}</b><span>في الشغل</span></div><div class="stat"><b style="color:${ATT.present.c}">${c.present}</b><span>حضر</span></div><div class="stat"><b style="color:${ATT.late.c}">${c.late}</b><span>متأخر</span></div><div class="stat"><b style="color:${ATT.absent.c}">${c.absent}</b><span>غاب</span></div></div>`;
  if(!emps.length) return h+empty('مفيش موظفين','ضيفهم من تبويب الموظفين');
  emps.forEach(e=>{
    const en=ent(d,e.id),a=attOf(d,e.id),st=en?.status&&state.statuses?.[en.status];
    h+=`<div class="card ${st&&!st.work?'dim':''}"><div class="row" data-act="edit" data-d="${d}" data-e="${e.id}"><div class="r-name">${esc(e.name)}</div><div class="chips">${chipsFor(en)||'<span class="muted small">مش متحدد — اضغط للتعديل</span>'}</div></div>
    ${punchLine(d,e.id)}<div class="att">${Object.entries(ATT).map(([k,v])=>`<button data-act="att" data-d="${d}" data-e="${e.id}" data-k="${k}" class="${a===k?'on':''}" style="${a===k?`background:${v.c}`:''}">${v.t}</button>`).join('')}</div>
    ${en?.note?`<div class="note">${esc(en.note)}</div>`:''}</div>`;
  });
  return h;
}

function tabWeek(){
  const ds=weekDates(view.week),emps=list('employees'),T=today();
  let h=nav(`${shortD(ds[0])} – ${fullD(ds[6])}`,ds.includes(T)?'الأسبوع ده':'اضغط هنا لاختيار أسبوع','weekStep',`<input type="date" value="${view.week}" data-change="setWeek" aria-label="اختار أسبوع">`);
  h+=`<div class="tools"><button class="tbtn" data-act="copyWeek">نسخ الأسبوع اللي فات</button><button class="tbtn" data-act="printWeek">طباعة</button><button class="tbtn" data-act="xlsWeek">Excel</button></div>`;
  if(!emps.length) return h+empty('مفيش موظفين','ضيفهم من تبويب الموظفين');
  ds.forEach(d=>{
    h+=`<div class="card"><div class="card-h ${d===T?'is-today':''}"><span>${dayName(d)}</span><span>${fullD(d)}</span></div>`;
    emps.forEach(e=>{h+=`<div class="row" data-act="edit" data-d="${d}" data-e="${e.id}"><div class="r-name">${esc(e.name)}</div><div class="chips">${chipsFor(ent(d,e.id),attOf(d,e.id))||'<span class="muted">—</span>'}</div></div>`;});
    h+='</div>';
  });
  return h;
}

function openEdit(d,e){
  const emp=state.employees?.[e];if(!emp)return;const en=ent(d,e)||{};
  const grp=(name,items,cur,label)=>`<label class="lbl">${label}</label><div class="pick" data-group="${name}"><button data-act="sel" data-v="" class="${!cur?'on':''}">بدون</button>${items.map(i=>`<button data-act="sel" data-v="${i.id}" class="${cur===i.id?'on':''}">${esc(i.name)}${i.start&&i.end?` <small>${fmtTime(i.start)}–${fmtTime(i.end)}</small>`:''}</button>`).join('')}</div>`;

/* ---------- export / print ---------- */
function cellText(e,a){const p=[];if(e?.shift)p.push(state.shifts?.[e.shift]?.name);if(e?.loc)p.push(state.locations?.[e.loc]?.name);if(e?.status)p.push(state.statuses?.[e.status]?.name);if(a)p.push(ATT[a]?.t);if(e?.note)p.push('('+e.note+')');return p.filter(Boolean).join(' - ');}
function blobDownload(content,type,name){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
async function downloadXlsx(sheets,fname){
  toast('بيجهّز الملف…');
  if(!window.XLSX){try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}catch(e){}}
  if(!window.XLSX){const a=sheets[0].aoa;const csv='﻿'+a.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');blobDownload(csv,'text/csv',fname.replace('.xlsx','.csv'));return;}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s.aoa);ws['!cols']=s.aoa[0].map((_,i)=>({wch:i===0?14:(s.w||24)}));XLSX.utils.book_append_sheet(wb,ws,s.name);});
  wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,fname);
}
function xlsWeek(){
  const ds=weekDates(view.week),emps=list('employees');
  const grid=[['الاسم',...ds.map(d=>`${dayName(d)} ${fullD(d)}`)],...emps.map(e=>[e.name,...ds.map(d=>cellText(ent(d,e.id),attOf(d,e.id)))])];
  downloadXlsx([{name:'الجدول',aoa:grid},{name:'تفاصيل',aoa:detailAoa(ds,emps),w:14}],`جدول ${fullD(ds[0]).replace(/\//g,'-')}.xlsx`);
}
function detailAoa(ds,emps){
  const rows=[['التاريخ','اليوم','الاسم','الوردية','المكان','الحالة','الحضور','بصمة دخول','بصمة خروج','ملاحظات']];
  ds.forEach(d=>emps.forEach(e=>{const en=ent(d,e.id),a=attOf(d,e.id);if(!en&&!a&&!punchOf(d,e.id))return;rows.push([fullD(d),dayName(d),e.name,state.shifts?.[en?.shift]?.name||'',state.locations?.[en?.loc]?.name||'',state.statuses?.[en?.status]?.name||'',a?ATT[a].t:'',(t=>t!=null?fmtClock(t):'')(pTime(punchOf(d,e.id),'in')),(t=>t!=null?fmtClock(t):'')(pTime(punchOf(d,e.id),'out')),en?.note||'']);}));
  return rows;
}
function xlsMonth(){

  const sum=[['الاسم',...sts.map(s=>s.name),...Object.values(ATT).map(a=>a.t)],...emps.map(e=>{const c=countFor(e.id,ds);return [e.name,...sts.map(s=>c.st[s.id]||0),...Object.keys(ATT).map(k=>c.att[k]||0)];})];

  att:d=>{const man=state.attendance?.[d.d]?.[d.e]||null;if(!man&&attOf(d.d,d.e)===d.k)return toast('ده متسجل من البصمة');save(`attendance/${d.d}/${d.e}`,man===d.k?null:d.k);},
  saveEdit:()=>{if(!editCtx)return;const{e}=editCtx;const v={shift:selVal('shift'),loc:selVal('loc'),status:selVal('status'),note:$sheet.querySelector('#f-note').value.trim()};Object.keys(v).forEach(k=>{if(!v[k])delete v[k];});
    const days=[...$sheet.querySelectorAll('[data-group="days"] .on')].map(b=>b.dataset.v);const upd={};days.forEach(x=>upd[`schedule/${x}/${e}`]=Object.keys(v).length?v:null);closeSheet();saveMany(upd);toast(days.length>1?`اتحفظ على ${days.length} أيام`:'اتحفظ');},
  clearEdit:()=>{if(!editCtx)return;const{d,e}=editCtx;closeSheet();save(`schedule/${d}/${e}`,null);toast('اتمسح');},
  copyWeek:()=>{const ds=weekDates(view.week);if(!ds.some(d=>state.schedule?.[addDays(d,-7)]))return toast('الأسبوع اللي فات فاضي');
    const run=()=>{const upd={};ds.forEach(d=>{upd[`schedule/${d}`]=state.schedule?.[addDays(d,-7)]||null;});saveMany(upd);toast('اتنسخ الأسبوع اللي فات');};
    ds.some(d=>state.schedule?.[d])?confirmSheet('نسخ الأسبوع اللي فات','الأسبوع ده فيه جدول بالفعل، هيتمسح ويتحط مكانه جدول الأسبوع اللي فات.','انسخ',run,true):run();},
  printWeek:()=>printWeek(), xlsWeek:()=>xlsWeek(), xlsMonth:()=>xlsMonth(),
  empMonth:d=>empMonthSheet(d.id),
  payLock:()=>{const on=!!state.settings?.payLock;
    if(on){save('settings/payLock',null);toast('الخدمة رجعت تشتغل عادي');}
    else confirmSheet('تفعيل وضع عدم الدفع','كل الموظفين هيتقفل عليهم التطبيق ويظهرلهم رسالة التحذير ورقم التواصل، لحد ما تقفل الوضع ده تاني.','فعّله',()=>{save('settings/payLock',true);toast('وضع عدم الدفع اتفعل');},true);},
  previewLock:()=>{openSheet(`<div style="margin:-18px -16px 0">${lockView().replace(/<div class="foot"[\s\S]*?<\/div><\/div>$/,'</div>')}</div><div class="btns"><button class="btn sec" data-act="closeSheet">قفل المعاينة</button></div>`);},
  // البصمة
  punch:()=>doPunch(),
  enrollFace:()=>{const me=state.devices?.[deviceId];if(me)enrollFace(me);},
  enrollFinger:()=>{const me=state.devices?.[deviceId];if(me)enrollFinger(me);},
  resetBio:d=>{const e=state.employees?.[d.id];if(!e)return;confirmSheet(`مسح بصمة ${esc(e.name)}`,'هيطلب منه يسجّل بصمته من جديد أول ما يفتح التطبيق.','امسح',()=>{save(`employees/${d.id}/bio`,null);toast('اتمسحت البصمة');},true);},
  punchToggle:()=>{save('settings/punchOff',punchOn()?true:null);toast(punchOn()?'البصمة اتفعلت':'البصمة اتقفلت');},
  setBioMode:d=>save('settings/bioMode',d.v==='both'?null:d.v),
  liveToggle:()=>save('settings/liveOff',liveOn()?true:null),
  setGrace:d=>save('settings/grace',+d.v),
  addGeo:()=>geoSheet(),
  editGeo:d=>geoSheet(d.id),
  geoHere:async(d,el)=>{const acc=document.getElementById('g-acc');el.disabled=true;if(acc)acc.textContent='بيحدد موقعك…';
    try{const c=await getPos();setGeoFields(+c.latitude.toFixed(6),+c.longitude.toFixed(6));if(acc)acc.textContent=`اتحدد ✓ (الدقة حوالي ${Math.round(c.accuracy)} متر)`;}
    catch(e){if(acc)acc.textContent=e?.code===1?'لازم تسمح بالموقع من إعدادات المتصفح':'ماقدرتش أحدد موقعك، شغّل الـ GPS';}
    el.disabled=false;},
  saveGeo:()=>{const n=$sheet.querySelector('#g-name').value.trim(),lat=parseFloat($sheet.querySelector('#g-lat').value),lng=parseFloat($sheet.querySelector('#g-lng').value),r=Math.max(10,parseInt($sheet.querySelector('#g-r').value)||100);
    if(!n)return toast('اكتب اسم المكان');if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return toast('حدد المكان على الخريطة الأول');
    const id=editCtx?.geo||'g'+uid(),old=state.geos?.[id]||{order:Date.now()};closeSheet();save(`geos/${id}`,{...old,name:n,lat,lng,r});toast('اتحفظ المكان');},
  delGeo:()=>{const id=editCtx?.geo;if(!id)return;confirmSheet('حذف المكان','البصمة مش هتتقبل من المكان ده تاني.','احذف',()=>save(`geos/${id}`,null),true);},
  // install
  install:async()=>{if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;p.prompt();try{await p.userChoice;}catch(e){}render();}else installHelp();},
  hideInstall:()=>{ls.set('sr_inst_hide','1');render();},
  // messages
  testSound:()=>chime(true),
  toggleSound:d=>{ls.set('sr_sound',soundOn()?'0':'1');if(soundOn())chime(true);const m=state.devices?.[deviceId];closeSheet();if(m)openMsgs(m,true);},
  openMsgs:d=>openMsgs(d.id,!!d.own),
  enableNotif:async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'الإشعارات اتفعلت':'الإشعارات مقفولة من إعدادات الموبايل');}catch(e){}closeSheet();},
  mAll:()=>{draft.to='all';render();},
  mTo:d=>{if(draft.to==='all')draft.to={};if(draft.to[d.id])delete draft.to[d.id];else draft.to[d.id]=true;if(!Object.keys(draft.to).length)draft.to='all';render();},
  mDay:d=>{draft.day=d.v;render();},
  insPh:d=>{const ta=document.getElementById('m-text');const st=ta?ta.selectionStart??draft.text.length:draft.text.length,en=ta?ta.selectionEnd??st:st;draft.text=draft.text.slice(0,st)+d.v+draft.text.slice(en);render();const t2=document.getElementById('m-text');if(t2){const c=st+d.v.length;t2.focus();t2.setSelectionRange(c,c);}},
  useTpl:d=>{const t=state.templates?.[d.id];if(t){draft.text=t.text;render();}},
  saveTpl:()=>{if(!draft.text.trim())return toast('اكتب الرسالة الأول');openSheet(`<div class="sh-h"><b>حفظ رسالة جاهزة</b></div><label class="lbl" for="t-name">اسمها</label><input class="inp" id="t-name" placeholder="مثال: تذكير بالوردية" autocomplete="off"><div class="preview">${esc(draft.text)}</div><div class="btns"><button class="btn" data-act="saveTplOk">حفظ</button><button class="btn sec" data-act="closeSheet">إلغاء</button></div>`);},
  saveTplOk:()=>{const n=$sheet.querySelector('#t-name').value.trim();if(!n)return toast('اكتب اسم للرسالة');closeSheet();save(`templates/t${uid()}`,{name:n,text:draft.text,order:Date.now()});toast('اتحفظت');},
  delTpl:d=>{const t=state.templates?.[d.id];confirmSheet(`حذف "${esc(t?.name||'')}"`,'الرسالة الجاهزة دي هتتمسح.','احذف',()=>save(`templates/${d.id}`,null),true);},
  sendApp:()=>{const tos=draftTo(),t=draft.text.trim();if(!t)return toast('اكتب الرسالة');if(!tos.length)return toast('اختار مين تتبعتله');const dd=draftDate(),to={},texts={};tos.forEach(x=>{to[x]=true;texts[x]=resolveText(t,x,dd);});
    confirmSheet('تأكيد الإرسال',`الرسالة هتوصل لـ ${tos.length===list('employees').length?'كل الموظفين':tos.map(x=>esc(state.employees[x].name)).join('، ')} جوه التطبيق.`,'ابعت',()=>{save(`messages/m${uid()}`,{text:t,at:Date.now(),to,texts});draft.text='';render();toast('اتبعتت');});},
  sendWa:()=>{const tos=draftTo(),t=draft.text.trim();if(!t)return toast('اكتب الرسالة');if(!tos.length)return toast('اختار مين تتبعتله');const dd=draftDate();
    openSheet(`<div class="sh-h"><b>ابعت على واتساب</b><span>${tos.length} موظف</span></div><p class="msg">دوس "ابعت" جنب كل واحد، هيفتحلك واتساب والرسالة جاهزة. اللي مالوش رقم هتختار انت الشات.</p>
    ${tos.map(x=>{const e=state.employees[x];return `<div class="wa-row"><div><b>${esc(e.name)}</b><div class="small muted" dir="ltr" style="text-align:right">${e.phone?esc(e.phone):'مفيش رقم — ضيفه من الموظفين'}</div></div><a class="btn wa" href="${waLink(e.phone,resolveText(t,x,dd))}" target="_blank" rel="noopener">ابعت</a></div>`;}).join('')}
    <div class="btns"><button class="btn sec" data-act="closeSheet">قفل</button></div>`);},
  msgInfo:d=>msgInfo(d.id),
  delMsg:d=>{confirmSheet('حذف الرسالة','هتتمسح من عند الموظفين كمان.','احذف',()=>{save(`messages/${d.id}`,null);toast('اتحذفت');},true);},
  // employees
  mvEmp:d=>{const emps=list('employees');const i=emps.findIndex(e=>e.id===d.id),j=i+(+d.n);if(i<0||j<0||j>=emps.length)return;[emps[i],emps[j]]=[emps[j],emps[i]];const upd={};emps.forEach((e,k)=>upd[`employees/${e.id}/order`]=k);saveMany(upd);},
  renameEmp:d=>{const e=state.employees?.[d.id];if(!e)return;editCtx={id:d.id};openSheet(`<div class="sh-h"><b>تعديل الموظف</b></div><label class="lbl" for="r-name">الاسم</label><input class="inp" id="r-name" value="${esc(e.name)}" autocomplete="off"><label class="lbl" for="r-phone">رقم الموبايل (للواتساب)</label><input class="inp" id="r-phone" type="tel" dir="ltr" placeholder="01xxxxxxxxx" value="${esc(e.phone||'')}" autocomplete="off"><div class="btns"><button class="btn" data-act="saveRename">حفظ</button><button class="btn sec" data-act="closeSheet">إلغاء</button></div>`);},
  saveRename:()=>{const n=$sheet.querySelector('#r-name').value.trim();if(!n)return toast('اكتب الاسم');const id=editCtx.id;const ph=$sheet.querySelector('#r-phone').value.trim();closeSheet();saveMany({[`employees/${id}/name`]:n,[`employees/${id}/phone`]:ph||null});toast('اتعدل');},
  unlink:d=>{const e=state.employees?.[d.id];if(!e)return;confirmSheet(`فك ربط ${esc(e.name)}`,'الموبايل المربوط هيرجع لشاشة "انت مين؟" والموظف يقدر يختار اسمه تاني من أي موبايل.','فك الربط',()=>{saveMany({[`devices/${e.device}`]:null,[`employees/${d.id}/device`]:null,[`employees/${d.id}/bio`]:null});toast('اتفك الربط');},true);},
  delEmp:d=>{const e=state.employees?.[d.id];if(!e)return;confirmSheet(`حذف ${esc(e.name)}`,'الموظف هيتشال من الجداول والتقارير. متأكد؟','احذف',()=>{const u={[`employees/${d.id}`]:null};if(e.device&&state.devices?.[e.device]===d.id)u[`devices/${e.device}`]=null;saveMany(u);toast('اتحذف');},true);},
  // settings items
  addItem:d=>openItem(d.c), editItem:d=>openItem(d.c,d.id),
  saveItem:()=>{const{c,id}=editCtx;const name=$sheet.querySelector('#i-name').value.trim();if(!name)return toast('اكتب الاسم');
    const old=id?(state[c]?.[id]||{}):{order:Date.now()};const o={...old,name};const g=k=>$sheet.querySelector(k);
    if(g('#i-start')){o.start=g('#i-start').value||null;o.end=g('#i-end').value||null;}
    if(g('[data-group="color"]')){const col=selVal('color');if(col)o.color=col;}
    if(g('#i-work'))o.work=g('#i-work').checked;
    Object.keys(o).forEach(k=>{if(o[k]===null||o[k]===undefined)delete o[k];});
    closeSheet();save(`${c}/${id||c[0]+uid()}`,o);toast('اتحفظ');},
  delItem:()=>{const{c,id}=editCtx;const it=state[c]?.[id];confirmSheet(`حذف ${esc(it?.name||'')}`,'الأيام اللي متسجل فيها ده هتفضل من غيره.','احذف',()=>{save(`${c}/${id}`,null);toast('اتحذف');},true);},
  exportJson:()=>{const s=JSON.parse(JSON.stringify(state));blobDownload(JSON.stringify(s,null,1),'application/json',`نسخة-ورديات-${today()}.json`);},
  importJson:()=>document.getElementById('imp').click(),
  clearSchedule:()=>confirmSheet('مسح كل الجداول والحضور','كل الجداول وتسجيل الحضور هيتمسحوا نهائي. الموظفين والإعدادات هيفضلوا. نزّل نسخة احتياطية الأول.','امسح',()=>{saveMany({schedule:null,attendance:null});toast('اتمسح');},true)
};
const C={
  mDate:el=>{if(el.value){draft.day=el.value;render();}},
  setDate:el=>{if(el.value){view.date=el.value;render();}},
  setWeek:el=>{if(el.value){view.week=weekStart(el.value);render();}},
  setMonth:el=>{if(el.value){view.month=el.value;render();}},
  setUWeek:el=>{if(el.value){view.uWeek=weekStart(el.value);render();}},
  setUMonth:el=>{if(el.value){view.uMonth=el.value;render();}},
  importJson:el=>{const f=el.files?.[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let obj;try{obj=JSON.parse(r.result);}catch(e){return toast('الملف ده مش نسخة صحيحة');}
    if(!obj||!obj.meta||!obj.employees)return toast('الملف ده مش نسخة صحيحة');
    confirmSheet('استرجاع النسخة','كل الداتا الحالية هتتبدل بالنسخة دي.','استرجع',()=>{saveMany({'':obj});toast('اترجعت النسخة');},true);};r.readAsText(f);}
};
const S={
  login:async form=>{const p=form.querySelector('#pw').value;const er=document.getElementById('pw-err');if(!p){er.textContent='اكتب الباسورد';return;}
    if(!window.crypto?.subtle){er.textContent='افتح الصفحة من لينك https';return;}
    const h=await sha(p);if(h===adminHash()){ls.set('sr_admin',h);view.screen=null;view.tab='today';document.activeElement?.blur();render();top0();}else{er.textContent='الباسورد غلط';form.querySelector('#pw').select();}},
  addEmp:form=>{const i=form.querySelector('#new-emp');const n=i.value.trim();if(!n)return toast('اكتب الاسم');i.value='';i.blur();const max=Math.max(-1,...list('employees').map(e=>e.order??0));save(`employees/e${uid()}`,{name:n,order:max+1});toast(`اتضاف ${n}`);},
  changePw:async form=>{
    const v=k=>form.querySelector(k).value,er=form.querySelector('#pwc-err'),btn=form.querySelector('#pwc-btn');
    const fail=m=>{er.style.color='var(--red)';er.textContent=m;};
    if(!window.crypto?.subtle)return fail('افتح الصفحة من لينك https');
    if(!v('#pw-old'))return fail('اكتب الباسورد الحالي');
    if(await sha(v('#pw-old'))!==adminHash())return fail('الباسورد الحالي غلط');
    if(v('#pw-new').length<4)return fail('الباسورد الجديد لازم يكون 4 حروف أو أكتر');
    if(v('#pw-new')!==v('#pw-new2'))return fail('الباسورد الجديد والتأكيد مش زي بعض');
    const h=await sha(v('#pw-new'));
    if(mode==='gas'){
      btn.disabled=true;btn.textContent='بيحفظ على الشيت…';er.textContent='';
      try{
        const res=await api({upd:{'settings/adminHash':h}});
        if(res?.settings?.adminHash!==h)throw new Error('الشيت مارجعش الباسورد الجديد');
        state=res;ls.set('sr_cache',JSON.stringify(state));setOnline(true);
      }catch(e){btn.disabled=false;btn.textContent='غيّر الباسورد';return fail('ماتحفظش على الشيت: '+(e.message||e)+' — اتأكد من النت ومن إعدادات Deploy (Anyone)');}
      ls.set('sr_admin',h);document.activeElement?.blur();render();
    } else {ls.set('sr_admin',h);document.activeElement?.blur();save('settings/adminHash',h);}
    toast('اتغير الباسورد ✓');
    const e2=document.getElementById('pwc-err');if(e2){e2.style.color='var(--green)';e2.textContent='اتغير الباسورد واتحفظ. من دلوقتي ادخل بالباسورد الجديد.';}
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el);}});
document.addEventListener('input',e=>{if(e.target.dataset?.input==='geoPaste'){const c=parseCoords(e.target.value);if(c)setGeoFields(c.lat,c.lng);return;}if(e.target.dataset?.input==='mText'){draft.text=e.target.value;const pv=document.getElementById('m-prev');if(pv)pv.innerHTML=previewHtml();}});
document.addEventListener('change',e=>{const k=e.target.dataset?.change;if(k&&C[k])C[k](e.target);});
document.addEventListener('submit',e=>{const k=e.target.dataset?.submit;if(!k)return;e.preventDefault();S[k]&&S[k](e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$sheet.classList.contains('open'))closeSheet();});

/* ---------- start ---------- */
function fatal(msg){$app.innerHTML=`<div class="hero"><h1 style="font-size:20px">في مشكلة</h1><p>${esc(msg)}</p></div><div class="foot"><button class="btn" style="width:auto" onclick="location.reload()">جرّب تاني</button></div>`;}
async function init(){
  deviceId=getDeviceId();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(API_URL){
    mode='gas';
    try{queue=JSON.parse(ls.get('sr_queue')||'[]')||[];}catch(e){queue=[];}
    try{const c=JSON.parse(ls.get('sr_cache')||'null');if(c&&c.meta){state=c;ready=true;render();}}catch(e){}
    pull();
    let tick=0;setInterval(()=>{tick++;if(document.visibilityState==='visible'||tick%4===0)pull();},15000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull();});
    window.addEventListener('online',()=>pull());
    return;
  }
  mode='local';try{state=JSON.parse(ls.get('sr_data')||'{}')||{};}catch(e){state={};}
  if(!state.meta){state=seedData();persist();}
  ready=true;render();
}
init();
</script>
